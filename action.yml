name: "Flakeguard - Flaky Test Detector"
description: "Find, rank and report flaky tests from your JUnit XML or TAP reports."
author: "Prathamesh Kulkarni"
branding:
  icon: "activity"
  color: "purple"

inputs:
  reports:
    description: "Path, glob or directory containing test report files."
    required: false
    default: "reports"
  min-runs:
    description: "Minimum number of runs a test must appear in to be reported."
    required: false
    default: "2"
  min-score:
    description: "Only report tests at or above this flakiness score (0-1)."
    required: false
    default: "0"
  max-flaky:
    description: "Fail the job if more than this many NEW flaky tests are found. Use -1 to never fail."
    required: false
    default: "-1"
  quarantine:
    description: "Optional path to a quarantine file of known-flaky tests."
    required: false
    default: ""
  single-run:
    description: "Treat all report files as one run (Maven/Gradle write one XML per test class)."
    required: false
    default: "false"
  comment:
    description: "Post/update the report as a comment on pull requests."
    required: false
    default: "true"

outputs:
  flaky-count:
    description: "Number of NEW (non-quarantined) flaky tests found."
    value: ${{ steps.scan.outputs.flaky-count }}
  report-path:
    description: "Path to the generated Markdown report."
    value: ${{ steps.scan.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Install flakeguard
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Scan reports
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        # Arrays, so paths containing spaces survive intact.
        QFLAG=()
        if [ -n "${{ inputs.quarantine }}" ]; then
          QFLAG=(--quarantine "${{ inputs.quarantine }}")
        fi
        SFLAG=()
        if [ "${{ inputs.single-run }}" = "true" ]; then
          SFLAG=(--single-run)
        fi
        # Pass the commit explicitly: it is the same for every file in this
        # build, and saying so avoids the "applied to many files" warning.
        flakeguard scan "${{ inputs.reports }}" \
          --min-runs "${{ inputs.min-runs }}" \
          --min-score "${{ inputs.min-score }}" \
          --commit "${{ github.sha }}" \
          "${QFLAG[@]}" "${SFLAG[@]}" \
          --format markdown -o flakeguard-report.md
        flakeguard scan "${{ inputs.reports }}" \
          --min-runs "${{ inputs.min-runs }}" \
          --min-score "${{ inputs.min-score }}" \
          --commit "${{ github.sha }}" \
          "${QFLAG[@]}" "${SFLAG[@]}" \
          --format json -o flakeguard-report.json
        count=$(python -c "import json;print(json.load(open('flakeguard-report.json'))['summary']['new_flaky'])")
        echo "flaky-count=$count" >> "$GITHUB_OUTPUT"
        echo "report-path=flakeguard-report.md" >> "$GITHUB_OUTPUT"
        echo "flakeguard found $count new flaky test(s)"

    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- flakeguard-report -->';
          const body = marker + '\n' + fs.readFileSync('flakeguard-report.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce flakiness budget
      if: ${{ inputs.max-flaky != '-1' }}
      shell: bash
      run: |
        count="${{ steps.scan.outputs.flaky-count }}"
        max="${{ inputs.max-flaky }}"
        if [ "$count" -gt "$max" ]; then
          echo "::error::flakeguard found $count new flaky tests, exceeding the budget of $max"
          exit 1
        fi
        echo "flakeguard: $count new flaky test(s), within budget ($max)"
