# Publish to PyPI when a version tag is pushed.
#
# Setup (one time, done by the maintainer):
#   1. Create the project on PyPI.
#   2. Add a "Trusted Publisher" on PyPI pointing at this repository and the
#      workflow file name "release.yml" (PyPI > project > Publishing).
#   3. Push a tag:  git tag v0.1.0 && git push origin v0.1.0
#
# No API token is stored anywhere - PyPI trusts this workflow directly (OIDC).

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
