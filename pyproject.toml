[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flakeguard"
version = "0.7.0"
description = "Find, rank, and quarantine flaky tests from any language's test reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prathamesh Kulkarni" }]
keywords = ["testing", "flaky-tests", "ci", "junit", "test-reports", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
flakeguard = "flakeguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/PrathameshKulkarni2k4/flakeguard"

[tool.hatch.build.targets.wheel]
packages = ["src/flakeguard"]
